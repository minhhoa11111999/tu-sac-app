<!DOCTYPE html>
<!-- saved from url=(0045)https://hoa34.w3spaces-preview.com/index.html -->
<html lang="vi"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tứ Sắc - Chơi Là Mất</title>
  <!-- Thêm thư viện Supabase -->
  <script src="./index_files/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', -apple-system, sans-serif; }
    body { background: linear-gradient(135deg, #e0f7fa 0%, #fff9c4 100%); color: #2c3e50; padding: 16px; min-height: 100vh; display: flex; justify-content: center; }
    .app-card { width: 100%; max-width: 480px; background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,150,136,0.15); border: 3px solid #4db6ac; }
    .header { text-align: center; margin-bottom: 20px; }
    .logo-container { width: 90px; height: 90px; margin: 0 auto 10px; background: #ffe082; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 3px dashed #ffb300; }
    .logo-cards { display: flex; gap: 3px; }
    .card-icon { width: 14px; height: 38px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; color: #fff; }
    .card-red { background: #e53935; } .card-green { background: #43a047; } .card-yellow { background: #fdd835; color: #333; } .card-white { background: #fff; color: #333; border: 1px solid #ccc; }
    .app-title { font-size: 20px; font-weight: 900; color: #00796b; }
    .app-subtitle { font-size: 13px; color: #e53935; font-weight: 700; font-style: italic; }
    .section-title { font-size: 14px; font-weight: 800; color: #004d40; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .box { background: #f1f8e9; border-radius: 14px; padding: 14px; margin-bottom: 16px; border: 1.5px solid #c5e1a5; }
    .players-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .player-btn { background: #fff; border: 2px solid #81c784; border-radius: 12px; padding: 10px 4px; text-align: center; cursor: pointer; }
    .player-btn.selected { background: #ffe082; border-color: #ff8f00; transform: scale(1.05); }
    .win-types { display: flex; gap: 10px; margin-top: 12px; }
    .type-btn { flex: 1; padding: 10px; border: 2px solid #26a69a; background: #fff; color: #00695c; font-weight: 800; font-size: 13px; border-radius: 10px; cursor: pointer; text-align: center; }
    .type-btn.selected { background: #26a69a; color: #fff; }
    .btn-submit { width: 100%; padding: 14px; margin-top: 12px; background: linear-gradient(135deg, #ff9800, #f57c00); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; }
    .score-board { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .score-card { background: #fff; border-radius: 10px; padding: 10px; text-align: center; border: 1px solid #b2dfdb; }
    .score-card .val { font-size: 18px; font-weight: 900; margin-top: 2px; }
    .pos { color: #2e7d32; } .neg { color: #c62828; } .zero { color: #78909c; }
    .history-toggle-btn { background: #e0f2f1; border: 1px solid #80cbc4; color: #004d40; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 800; cursor: pointer; }
    .history-content { display: none; margin-top: 12px; padding-top: 10px; border-top: 1px dashed #bdbdbd; }
    .history-content.open { display: block; }
    .history-list { list-style: none; max-height: 220px; overflow-y: auto; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #e0e0e0; font-size: 13px; }
    .history-time { font-size: 11px; color: #757575; }
    .btn-del { background: #ef5350; color: #fff; border: none; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .btn-reset { width: 100%; padding: 10px; background: #78909c; color: #fff; border: none; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; margin-top: 12px; }
  </style>
</head>
<body>

<div class="app-card">
  <div class="header">
    <div class="logo-container">
      <div class="logo-cards">
        <div class="card-icon card-red">Tướng</div>
        <div class="card-icon card-green">Sĩ</div>
        <div class="card-icon card-yellow">Tượng</div>
        <div class="card-icon card-white">Xe</div>
      </div>
    </div>
    <div class="app-title">TỨ SẮC</div>
    <div class="app-subtitle">"CHƠI LÀ MẤT"</div>
  </div>

  <div class="box">
    <div class="section-title"><span>👑 Ai Thắng Ván Này?</span></div>
    <div class="players-grid" id="playersGrid"><div class="player-btn "><div style="font-size:24px;">👨‍💼</div><div style="font-size:13px; font-weight:800; color:#2e7d32;">Hải</div></div><div class="player-btn "><div style="font-size:24px;">🧑‍💻</div><div style="font-size:13px; font-weight:800; color:#2e7d32;">Hòa</div></div><div class="player-btn "><div style="font-size:24px;">👨‍🎨</div><div style="font-size:13px; font-weight:800; color:#2e7d32;">Công</div></div><div class="player-btn "><div style="font-size:24px;">🤵</div><div style="font-size:13px; font-weight:800; color:#2e7d32;">Tín</div></div></div>
    <div class="section-title" style="margin-top: 12px;"><span>🎴 Loại Chiến Thắng</span></div>
    <div class="win-types">
      <button class="type-btn selected" id="btnTron" onclick="selectType(&#39;tron&#39;)">Thắng Trơn (+5xu/người)</button>
      <button class="type-btn" id="btnHoang" onclick="selectType(&#39;hoang&#39;)">Thắng Hoang (+10xu/người)</button>
    </div>
    <button class="btn-submit" onclick="addGame()">GHI NHẬN KẾT QUẢ</button>
  </div>

  <div class="box" style="background: #e0f2f1; border-color: #80cbc4;">
    <div class="section-title"><span>📊 Tổng Kết Xu Hiện Tại</span></div>
    <div class="score-board" id="scoreBoard"><div class="score-card"><div style="font-weight:800; font-size:14px;">👨‍💼 Hải</div><div class="val zero">0 xu</div></div><div class="score-card"><div style="font-weight:800; font-size:14px;">🧑‍💻 Hòa</div><div class="val zero">0 xu</div></div><div class="score-card"><div style="font-weight:800; font-size:14px;">👨‍🎨 Công</div><div class="val zero">0 xu</div></div><div class="score-card"><div style="font-weight:800; font-size:14px;">🤵 Tín</div><div class="val zero">0 xu</div></div></div>
  </div>

  <div class="box" style="background: #fff; border-color: #e0e0e0;">
    <div class="section-title">
      <span>📜 Lịch Sử Các Ván</span>
      <button class="history-toggle-btn" onclick="toggleHistory()">📋 <span id="historyToggleText">Xem lịch sử</span></button>
    </div>
    <div class="history-content" id="historyContent">
      <ul class="history-list" id="historyList"><li style="text-align:center; color:#aaa; font-size:12px;">Chưa có ván nào.</li></ul>
      <button class="btn-reset" onclick="resetAll()">🔄 Xoá Tất Cả / Chơi Ván Mới</button>
    </div>
  </div>
</div>

<script>
  // THAY THẾ CÁC THÔNG TIN SUPABASE CỦA BẠN VÀO ĐÂY
  const SUPABASE_URL = 'https://lqsrgacggqpffdgmjbep.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_w5knrhMXCpXyou_wAKjx8A_Yv75VoCI';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const players = [
    { name: "Hải", avatar: "👨‍💼" },
    { name: "Hòa", avatar: "🧑‍💻" },
    { name: "Công", avatar: "👨‍🎨" },
    { name: "Tín", avatar: "🤵" }
  ];

  let selectedWinner = null;
  let winType = 'tron';
  let historyData = [];
  let isHistoryOpen = false;

  async function loadDataFromSupabase() {
    const { data, error } = await _supabase.from('games').select('*').order('id', { ascending: true });
    if (!error && data) {
      historyData = data;
      renderScores();
      renderHistory();
    }
  }

  function renderPlayers() {
    const grid = document.getElementById('playersGrid');
    grid.innerHTML = '';
    players.forEach((p, idx) => {
      const btn = document.createElement('div');
      btn.className = `player-btn ${selectedWinner === idx ? 'selected' : ''}`;
      btn.onclick = () => { selectedWinner = idx; renderPlayers(); };
      btn.innerHTML = `<div style="font-size:24px;">${p.avatar}</div><div style="font-size:13px; font-weight:800; color:#2e7d32;">${p.name}</div>`;
      grid.appendChild(btn);
    });
  }

  function selectType(type) {
    winType = type;
    document.getElementById('btnTron').className = `type-btn ${type === 'tron' ? 'selected' : ''}`;
    document.getElementById('btnHoang').className = `type-btn ${type === 'hoang' ? 'selected' : ''}`;
  }

  function toggleHistory() {
    isHistoryOpen = !isHistoryOpen;
    document.getElementById('historyContent').classList.toggle('open', isHistoryOpen);
    document.getElementById('historyToggleText').innerText = isHistoryOpen ? 'Thu gọn' : 'Xem lịch sử';
  }

  async function addGame() {
    if (selectedWinner === null) { alert("Vui lòng chọn người thắng!"); return; }
    const gain = winType === 'tron' ? 5 : 10;
    
    const { error } = await _supabase.from('games').insert([{ winner: selectedWinner, win_type: winType, gain: gain }]);
    if (!error) {
      selectedWinner = null;
      renderPlayers();
      await loadDataFromSupabase();
    }
  }

  async function deleteGame(id) {
    const { error } = await _supabase.from('games').delete().eq('id', id);
    if (!error) await loadDataFromSupabase();
  }

  async function resetAll() {
    if (confirm("Reset lại từ đầu cho cả 4 anh em?")) {
      const { error } = await _supabase.from('games').delete().gt('id', 0);
      if (!error) await loadDataFromSupabase();
    }
  }

  function renderScores() {
    let scores = [0, 0, 0, 0];
    historyData.forEach(g => {
      const totalGain = g.gain * 3;
      for (let i = 0; i < 4; i++) {
        if (i === g.winner) scores[i] += totalGain;
        else scores[i] -= g.gain;
      }
    });

    const board = document.getElementById('scoreBoard');
    board.innerHTML = '';
    players.forEach((p, i) => {
      const val = scores[i];
      let cls = val > 0 ? 'pos' : (val < 0 ? 'neg' : 'zero');
      let txt = val > 0 ? `+${val} xu` : `${val} xu`;
      const card = document.createElement('div');
      card.className = 'score-card';
      card.innerHTML = `<div style="font-weight:800; font-size:14px;">${p.avatar} ${p.name}</div><div class="val ${cls}">${txt}</div>`;
      board.appendChild(card);
    });
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    list.innerHTML = historyData.length === 0 ? '<li style="text-align:center; color:#aaa; font-size:12px;">Chưa có ván nào.</li>' : '';
    
    historyData.slice().reverse().forEach((g, idx) => {
      const timeStr = new Date(g.created_at).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' - ' + new Date(g.created_at).toLocaleDateString('vi-VN');
      const li = document.createElement('li');
      li.className = 'history-item';
      li.innerHTML = `
        <div>
          <div><b>Ván ${historyData.length - idx}:</b> ${players[g.winner].name} thắng ${g.win_type === 'tron' ? 'Trơn (+15)' : 'Hoang (+30)'}</div>
          <div class="history-time">⏱️ ${timeStr}</div>
        </div>
        <button class="btn-del" onclick="deleteGame(${g.id})">Xoá</button>
      `;
      list.appendChild(li);
    });
  }

  renderPlayers();
  loadDataFromSupabase();
</script>


</body></html>
